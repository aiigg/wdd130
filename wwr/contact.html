<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Splash White Water Rafting</title>
    <meta name="description"
      content="Get in touch with Splash White Water Rafting. Find our address, phone number, email, interactive map, or send us a message to ask questions.">
    <meta name="author" content="Godiva Aigbosurea">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- Shared Header and Navigation -->
    <header>
        <img src="images/z-splash.jpg" alt="Splash White Water Rafting Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Company Information -->
        <section class="company-info">
            <h1>Splash White Water Rafting</h1>
            <p><strong>Address:</strong> 123 Main River Street, Kolob, California</p>
            <p><strong>Phone:</strong> +1 999 999 9999</p>
            <p><strong>Email:</strong> info@SPlashwater.com</p>
        </section>

        <!-- Map and Form Section -->
        <section class="contact-grid">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d211675.82621105868!2d-118.75028705000001!3d34.007048999999995!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80e81da9f908d63f%3A0x93b72d71b2ea8c5a!2sMalibu%2C%20CA%2C%20USA!5e0!3m2!1sen!2sng!4v1791027755032!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="Splash White Water Rafting Location Map">
                </iframe>
            </div>

            <!-- Contact Form -->
            <form action="#" method="post" class="contact-form">
                <div class="form-item">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname"
                      placeholder="Enter your full name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                      placeholder="Enter your email Address" required>
                </div>

                <fieldset class="form-item radio-group">
                    <legend>Purpose of Message</legend>
                    <label for="purpose-general">
                        <input type="radio" id="purpose-general" name="purpose"
                          value="General Inquiry" checked>
                        General Inquiry
                    </label>
                    <label for="purpose-reservation">
                        <input type="radio" id="purpose-reservation" name="purpose"
                          value="Reservation Question">
                        Reservation Question
                    </label>
                    <label for="purpose-suggestion">
                        <input type="radio" id="purpose-suggestion" name="purpose"
                          value="Website Suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Type your message here..." required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>

        <!-- Team / Employee Profile Section -->
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-cards">
                <figure class="employee-card">
                    <img src="images/employee1.png"
                      alt="Photo of Micheal Guirrera, Lead River Guide">
                    <figcaption>
                        <h3>Micheal Guirrera</h3>
                        <p>Lead River Guide</p>
                    </figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee2.png"
                      alt="Photo of Baby .F. Smith, Safety Coordinator">
                    <figcaption>
                        <h3>Baby .F. Smith</h3>
                        <p>Safety Coordinator</p>
                    </figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/employee3.png"
                      alt="Photo of Michael Stuttgard, Customer Experience Manager">
                    <figcaption>
                        <h3>Michael Stuttgard</h3>
                        <p>Customer Experience Manager</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <!-- Shared Footer -->
    <footer>
        <p>© 2026 Splash White Water Rafting | Godiva Aigbosurea</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank"><img src="images/facebook.png"
                  alt="Facebook icon"></a>
            <a href="https://instagram.com" target="_blank"><img src="images/instagram.png"
                  alt="Instagram icon"></a>
            <a href="https://twitter.com" target="_blank"><img src="images/twitter.png"
                  alt="Twitter icon"></a>
        </nav>
    </footer>

</body>

</html>
